name: aow

# Three networks, and only one of them has a route out.
#
#   backend  - internal: true. Every application service lives here. Docker
#              itself enforces that there is no external route.
#   frontend - a normal bridge, holding `edge` and nothing else. It exists
#              only because Docker cannot publish a port from an internal
#              network, so something has to straddle the boundary.
#   egress   - empty by default. compose.connected.yml attaches `ingestor`
#              to it for a connected refresh.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  pgdata:
  rabbitdata:
  ingestor_outbox:
  api_outbox:
  enricher_outbox:
  # One small JSON file: the report scripts/refresh.sh files about its last run.
  # Written in the ingestor, read-only in the api. Operator telemetry, not data
  # -- services/common/refresh_state.py says why it is not in the database.
  refresh_state:

x-queue-env: &queue_env
  RABBITMQ_USER: ${RABBITMQ_USER:-aow}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aow} -d ${POSTGRES_DB:-aow}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:ce634665a8e7262384a793581c20cb8a46343887446eb391b77c814febeca4b2
    restart: unless-stopped
    mem_limit: 768m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      # Declares, in the repository, which plugins the broker must run:
      # rabbitmq_management (the HTTP API, inside the stack only -- 15672 is
      # not published) and rabbitmq_prometheus (the exporter on 15692, the
      # only honest source of per-queue depth, since a crashed consumer
      # cannot report how far behind it is).
      #
      # Both plugins are already enabled by this pinned image -- verified, its
      # own /etc/rabbitmq/enabled_plugins reads
      # `[rabbitmq_management,rabbitmq_prometheus].` -- so this mount does not
      # switch the exporter on. It pins the dependency: a later image bump
      # that drops one fails here instead of leaving compose.observability.yml
      # scraping a closed port and every queue-depth alert silently never
      # firing.
      #
      # rabbitmq_management is named alongside it because the mount REPLACES
      # the image's file rather than adding to it. Listing only the exporter
      # would quietly disable the management API, and that surfaces much later
      # as a 404 from a diagnostic command rather than as a start-up error.
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot. Creates the schema and the two application roles, then exits 0.
  # Every service that touches the database waits on it completing, so a single
  # `docker compose up -d` is genuinely the whole startup (M5).
  migrate:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: "no"
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    # Passwords travel as psql variables, so they never appear in the SQL file.
    command: >
      psql -h postgres -U ${POSTGRES_USER:-aow} -d ${POSTGRES_DB:-aow}
           -v ON_ERROR_STOP=1
           -v writer_password=${POSTGRES_WRITER_PASSWORD:?set POSTGRES_WRITER_PASSWORD in .env}
           -v reader_password=${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
           -f /db/migrations/001_init.sql
           -f /db/migrations/002_activities.sql
           -f /db/migrations/003_demo_events.sql
    networks: [backend]

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:fb8f521cdfee1b763a6ef0d6633922e780c1393c03b49945526550cf55010343
    restart: unless-stopped
    mem_limit: 3g
    # The model is bind-mounted read-only from the staged directory and is
    # never pulled at runtime.
    volumes:
      - ./models:/models:ro
    # Two slots, not one, and --ctx-size doubled to match: llama.cpp divides
    # the context between slots, so this is still 4096 each. The reason is
    # contention. The enricher works through a queue of several hundred
    # recommendations, and with a single slot an interactive question from the
    # agent sits behind a whole batch and times out as though the model were
    # down. The second slot keeps the chat responsive while the backlog drains.
    # Raise --ctx-size alongside --parallel if you raise it again.
    #
    # Note: the command below is a YAML folded block, so a '#' inside it is an
    # argument, not a comment. Comments about it belong here.
    command: >
      -m /models/${LLM_MODEL_FILE:-Qwen3-1.7B-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLM_CTX_SIZE:-8192}
      --parallel ${LLM_PARALLEL:-2}
      --threads ${LLM_THREADS:-4}
      --metrics
    environment:
      # Qwen3 is a hybrid-thinking model: left on, every reply spends its
      # token budget in reasoning_content and returns empty content.
      # Measured: 4.2s and no answer with thinking on, 1.2s and a clean
      # answer with it off. Set as an env var because the equivalent CLI
      # flag loses its quoting through YAML + Docker arg splitting.
      LLAMA_ARG_CHAT_TEMPLATE_KWARGS: '{"enable_thinking":false}'
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      # The model load dominates first boot. The README says so, because
      # otherwise `docker compose ps` reads as a failed stack for ~3 minutes.
      start_period: 180s

  # ---- the pipeline: ingestor -> outbox -> rabbitmq -> consumer -> postgres --
  #
  # All four share one image and one dependency set; they differ only in the
  # module they run and in which credentials they are given.
  ingestor:
    build: &pysvc
      context: .
      dockerfile: services/Dockerfile
    image: aow/services:dev
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "services.ingestor.main"]
    environment:
      <<: *queue_env
      # The read-only role lets an operator reconcile this producer's outbox
      # against committed ingest_log IDs without granting it write access.
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aow}
    volumes:
      # The outbox lives on a named volume: the no-data-loss guarantee begins
      # at an fsynced row here, so it must outlive the container.
      - ingestor_outbox:/outbox
      # The operator refresh runs its fetch inside this container, so this is
      # where it files the report of its run. Writable here and nowhere else.
      - refresh_state:/refresh
    networks: [backend]

  consumer:
    build: *pysvc
    image: aow/services:dev
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "services.consumer.main"]
    environment:
      <<: *queue_env
      # The only service in the stack holding write credentials.
      POSTGRES_WRITER_PASSWORD: ${POSTGRES_WRITER_PASSWORD:?set POSTGRES_WRITER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aow}
    networks: [backend]

  # Words the recommendations the rules already decided. Deliberately not bound
  # to the weather stream: it polls `recommendations(status='pending')`, so a
  # slow or dead LLM can never hold up, or lose, a weather record.
  enricher:
    build: *pysvc
    image: aow/services:dev
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "services.enricher.main"]
    environment:
      <<: *queue_env
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aow}
      LLM_BASE_URL: http://llm:8080
      LLM_MODEL: ${LLM_MODEL:-Qwen3-1.7B-Q4_K_M}
      ENRICH_POLL_SECONDS: ${ENRICH_POLL_SECONDS:-60}
      ENRICH_BATCH: ${ENRICH_BATCH:-8}
    volumes:
      - enricher_outbox:/outbox
    networks: [backend]

  # The agent (M7-M9). Router-first: code resolves the city, the dates and the
  # coverage gate and runs the SQL; the model makes one call to phrase the rows.
  agent:
    build: *pysvc
    image: aow/services:dev
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "services.agent.main:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      LLM_BASE_URL: http://llm:8080
      LLM_MODEL: ${LLM_MODEL:-Qwen3-1.7B-Q4_K_M}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    build: *pysvc
    image: aow/services:dev
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *queue_env
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aow}
      AGENT_BASE: http://agent:8100
    volumes:
      # User edits are accepted here and published from here, so the API has an
      # outbox of its own on its own volume.
      - api_outbox:/outbox
      # Read-only, and it is one JSON file rather than another service's live
      # database: `GET /refresh/last` serves it so the UI can show what the last
      # operator refresh did. The api cannot write it; only the ingestor can.
      - refresh_state:/refresh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    image: aow/ui:dev
    restart: unless-stopped
    mem_limit: 512m
    environment:
      API_BASE: http://api:8000
    networks: [backend]

  edge:
    image: nginx:alpine@sha256:1ed1b0e1d7652937d6cbdaf4018c7b6fc009a7dd6c3047351e2eddda745de43f
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    # Loopback, deliberately. The API accepts writes -- POST /recommendations,
    # POST /itineraries, POST /reenrich, PATCH /records/... -- and it has no
    # authentication of its own, because every caller so far is either the UI
    # in the same stack or the operator on the same machine. A bare `8000:8000`
    # binds 0.0.0.0, so on any host with a LAN address those write routes would
    # be reachable by every client that can route to it. `127.0.0.1:` is the
    # boundary that matches what actually exists: a single-workstation demo.
    #
    # The UI is bound the same way for the same reason, not for its own sake:
    # it drives those write routes through `api`, so leaving 8080 open would
    # leave the write path open with an extra hop in front of it.
    #
    # AOW_BIND_ADDR exists so that a host with a real deployment behind it can
    # move the boundary on purpose rather than by editing this file -- but read
    # the Security section first. Exposing this beyond the trusted host needs
    # authenticated, authorised writes, and that does not exist yet.
    ports:
      - "${AOW_BIND_ADDR:-127.0.0.1}:8080:8080"   # UI
      - "${AOW_BIND_ADDR:-127.0.0.1}:8000:8000"   # API
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
