name: ci

# CI has the internet. The runtime does not -- that asymmetry is deliberate and
# is stated in the README. The `guard` job below is what keeps it honest: it
# fails the build if a hosted-model SDK, endpoint or credential ever appears in
# the source.

on:
  push:
    branches: [main]
  # `types` is listed explicitly, which means the three defaults have to be
  # listed too -- naming any type replaces the default set rather than adding
  # to it. `labeled` is the one being added, and without it the
  # `release-candidate` label path in the RC jobs below can never fire: adding
  # a label to an open pull request is not a `synchronize`, so nothing re-runs
  # and the expensive gates stay silently unreachable. Found by adding the
  # label to this workflow's own pull request and watching nothing happen.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes on a PR branch cancel their in-flight run. Give each
# `main` run its own group: cancel-in-progress: false alone is insufficient,
# because GitHub replaces an older *pending* run in the same group when a new
# one is queued. A workflow_dispatch while a push-to-main run was pending
# cancelled that push before publish-images could create its image manifest.
# Every main push must get its own CI and publish result for release gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check services tests scripts
      - run: ruff format --check services tests scripts

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run in the same image the project ships, so a test that passes here
      # passes on the reviewer's machine for the same reasons.
      - name: Build the test image
        run: docker build -f tests/Dockerfile -t aow/tests:ci .
      - name: Unit tests
        run: docker run --rm --network none aow/tests:ci

  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No hosted LLM anywhere in the source
        run: |
          set -o pipefail
          PATTERN='openai|anthropic|api\.openai|gemini|generativelanguage|cohere|mistral\.ai|together\.ai|groq|replicate|bedrock'
          if grep -rInE "$PATTERN" \
               --include='*.py' --include='*.txt' --include='*.yml' \
               --include='*.yaml' --include='*.toml' --include='*.sql' \
               services tests db data 2>/dev/null; then
            echo "::error::a hosted model SDK or endpoint appears in the source"
            exit 1
          fi
          echo "clean: the only model client is services/common/llm.py -> llm:8080"

      - name: No env files committed, and .env.example has no real secret
        run: |
          # Check every tracked path, including numbered or nested env files.
          # Do not print offending paths: an env filename may itself reveal
          # deployment details, and the contents must never reach CI logs.
          if git ls-files -z | python -c 'import pathlib, sys; paths = (pathlib.PurePosixPath(p.decode()).name for p in sys.stdin.buffer.read().split(b"\0") if p); sys.exit(any(name == ".env" or (name.startswith(".env.") and name != ".env.example") for name in paths))'; then
            :
          else
            echo "::error::a non-example env file is tracked by git"; exit 1
          fi
          test -f .env.example || { echo "::error::.env.example is missing"; exit 1; }
          # Password fields are placeholders; non-secret tuning values (for
          # example context size and parallelism) are intentionally real.
          # The final grep is quiet on purpose. It rejects exactly what it
          # rejected before -- any of these four whose value is not exactly
          # `change-me` -- but without -q the offending line goes to stdout,
          # so the one run that matters, the failing one, would write a real
          # password into a build log that outlives it.
          if grep -E '^(POSTGRES_PASSWORD|POSTGRES_WRITER_PASSWORD|POSTGRES_READER_PASSWORD|RABBITMQ_PASSWORD|GRAFANA_ADMIN_PASSWORD)=' .env.example \
               | grep -qvE '=change-me$'; then
            echo "::error::.env.example contains a non-placeholder password"; exit 1
          fi
          echo "clean"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"

      - name: Secret scanner positive control
        run: |
          # The action adds the binary it used to PATH. A clean scan alone
          # cannot distinguish a working scanner from one that scans nothing.
          # Generate a fake GitHub token only on the runner; never commit it or
          # print it. Exit 42 means the pinned scanner detected the canary.
          canary_dir="$(mktemp -d)"
          trap 'rm -rf "$canary_dir"' EXIT
          suffix="$(python3 -c 'import secrets, string; print("".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)))')"
          printf 'token = "ghp_%s"\n' "$suffix" > "$canary_dir/canary.txt"
          set +e
          gitleaks detect --no-git --source "$canary_dir" --exit-code=42 --redact > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 42 ]; then
            echo "::error::gitleaks did not detect the generated canary (exit $status)"
            exit 1
          fi
          echo "gitleaks detected the generated canary"

      - name: Secret scan of committed tree
        run: |
          set -o pipefail
          # On a merge push, gitleaks-action excludes the merge commit and can
          # report success after scanning zero commits. Scan the exact committed
          # tree as well, using the same pinned binary proved by the canary.
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -xf - -C "$scan_dir"
          test -s "$scan_dir/.github/workflows/ci.yml"
          gitleaks detect --no-git --source "$scan_dir" --redact

      - name: Images are pinned by digest
        run: |
          # Locally built images use :dev labels. Images pulled from a registry
          # must carry a digest so a later offline rebuild uses the same bytes.
          python - <<'PY'
          import re
          from pathlib import Path

          service = None
          image = None
          built = False
          errors = []

          def check():
              if service and image and not built and not re.fullmatch(r".+@sha256:[0-9a-f]{64}", image):
                  errors.append(f"{service}: {image}")

          # compose.tools.yml too: the staging and proof containers are pulled
          # on the reviewer's machine like any other, so a moving tag there
          # would break the same offline guarantee. compose.observability.yml
          # for the same reason -- it is opt-in, but an opt-in overlay with a
          # moving tag is still a runtime pull on somebody's air-gapped host.
          for path in (
              Path("compose.yml"),
              Path("compose.tools.yml"),
              Path("compose.observability.yml"),
          ):
              service, image, built = None, None, False
              for line in path.read_text().splitlines():
                  match = re.fullmatch(r"  ([a-z][a-z0-9_-]*):", line)
                  if match:
                      check()
                      service, image, built = match.group(1), None, False
                  elif service:
                      match = re.match(r"    image:\s*(\S+)", line)
                      if match:
                          image = match.group(1)
                      if re.match(r"    build:", line):
                          built = True
              check()
              service, image, built = None, None, False
          if errors:
              raise SystemExit("::error::unpinned pulled images: " + ", ".join(errors))
          print("every pulled image in the compose files carries a digest")
          PY

      - name: Docker base images are pinned by digest
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("services/Dockerfile"),
              Path("services/ui/Dockerfile"),
              Path("tests/Dockerfile"),
              Path("demos/Dockerfile"),
              # CI-only (F11): the headless-browser gate. Unpinned here would
              # be just as real a drift as an unpinned runtime image -- this
              # step does not distinguish, and neither should the guard.
              Path("tests/ui/Dockerfile"),
          ]
          for path in files:
              for line in path.read_text().splitlines():
                  if line.startswith("FROM ") and not re.fullmatch(r"FROM \S+@sha256:[0-9a-f]{64}(?: AS \S+)?", line):
                      raise SystemExit(f"::error file={path}::unpinned base image: {line}")
          print("all Dockerfile base images carry a digest")
          PY

      - name: Pinned digests match IMAGES.lock
        run: |
          # IMAGES.lock is what the README points a reviewer at, and what the
          # offline bundle is assembled against. A digest that is pinned but
          # no longer the one the lock records is a lock that documents a
          # release nobody is running.
          python - <<'PY'
          import re
          from pathlib import Path

          locked = {
              line.split("@")[0]: line.strip()
              for line in Path("IMAGES.lock").read_text().splitlines()
              if line.strip() and not line.startswith("#")
          }
          used = set()
          errors = []
          sources = [
              Path("compose.yml"), Path("compose.tools.yml"),
              Path("compose.observability.yml"), Path("Makefile"),
              Path("services/Dockerfile"), Path("services/ui/Dockerfile"),
              Path("tests/Dockerfile"), Path("demos/Dockerfile"),
              # CI-only (F11). compose.ci.yml itself is deliberately NOT
              # added here: it carries no `@sha256:` reference of its own
              # (it names the browser-gate image by tag, via
              # AOW_CI_UITEST_IMAGE, and the digest lives only in the
              # Dockerfile below) and it never reaches a reviewer's machine
              # or the offline bundle -- the property this lock protects.
              Path("tests/ui/Dockerfile"),
          ]
          for path in sources:
              for reference in re.findall(r"\S+@sha256:[0-9a-f]{64}", path.read_text()):
                  # postgres:17-alpine@sha256:... and postgres@sha256:... are
                  # the same image; IMAGES.lock records the untagged form.
                  repository = reference.split("@")[0].rsplit(":", 1)[0]
                  canonical = f"{repository}@{reference.split('@')[1]}"
                  if repository not in locked:
                      errors.append(f"{path}: {repository} is not in IMAGES.lock")
                  elif locked[repository] != canonical:
                      errors.append(f"{path}: {canonical} != IMAGES.lock {locked[repository]}")
                  else:
                      used.add(repository)
          for repository in sorted(set(locked) - used):
              errors.append(f"IMAGES.lock records {repository}, which nothing pins any more")
          if errors:
              raise SystemExit("::error::" + "; ".join(errors))
          print(f"IMAGES.lock matches every pinned reference ({len(used)} images)")
          PY

      - name: Validate delivery scripts and Compose overlay
        run: |
          bash -n scripts/*.sh
          bash -n demos/*.sh
          docker compose -f compose.yml -f compose.ci.yml --env-file .env.example config --quiet
          AOW_IMAGE_VERSION="$GITHUB_SHA" docker compose -f compose.yml -f compose.bundle.yml --env-file .env.example config --quiet
          # The monitoring overlay's bundled form. A reviewer running the
          # observability profile from an installed release passes all four,
          # so all four are rendered here -- an overlay combination nobody
          # validates is one that breaks on the reviewer's machine and
          # nowhere else.
          AOW_IMAGE_VERSION="$GITHUB_SHA" docker compose -f compose.yml -f compose.bundle.yml -f compose.observability.yml -f compose.observability.bundle.yml --env-file .env.example config --quiet
          # Every overlay a reviewer can actually pass to `docker compose -f`
          # is rendered here. An overlay nobody validates is one that breaks on
          # the reviewer's machine and nowhere else.
          docker compose -f compose.yml -f compose.connected.yml --env-file .env.example config --quiet
          docker compose -f compose.yml -f compose.demo.yml --env-file .env.example config --quiet
          docker compose -f compose.yml -f compose.observability.yml --env-file .env.example config --quiet
          # Rendered on its own: it is never combined with compose.yml, and its
          # one external network is not resolved at config time.
          docker compose -f compose.tools.yml --env-file .env.example config --quiet
          # F11's two gates: the browser gate's own overlay, and the model
          # grounding probe's overlay (release-candidate only -- see the
          # model-grounding job -- but still an overlay a maintainer runs by
          # hand, so it is still rendered here).
          docker compose -f compose.yml -f compose.model-probe.yml --env-file .env.example config --quiet
          AOW_IMAGE_VERSION="$GITHUB_SHA" docker compose -f compose.tools.yml -f compose.tools.bundle.yml --env-file .env.example config --quiet

      - name: Workflow actions are pinned by commit
        run: |
          # A tag is a movable pointer on someone else's repository. Every
          # third-party action here runs with this workflow's token, so the
          # bytes it executes are pinned the same way the runtime images are:
          # by immutable SHA, with the human-readable version in a comment.
          python - <<'PY'
          import re
          from pathlib import Path

          bad = []
          for path in Path(".github/workflows").glob("*.yml"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  # Anchored to the YAML key, so this script does not
                  # match its own source when it reads this file.
                  match = re.match(r"\s*-?\s*uses:\s+(\S+)", line)
                  # A local action (./path) has no upstream to move under us.
                  if match and not match.group(1).startswith("./"):
                      if not re.fullmatch(r"[^@]+@[0-9a-f]{40}", match.group(1)):
                          bad.append(f"{path}:{number}: {match.group(1)}")
          if bad:
              raise SystemExit("::error::actions not pinned to a commit: " + ", ".join(bad))
          print("every workflow action is pinned to a 40-character commit SHA")
          PY

      - name: README counts match the committed snapshot
        run: python scripts/snapshot_manifest.py --check

  # Builds, scans, and proves the stack works (scripts/ci-integration.sh:
  # real Postgres/RabbitMQ, five outage drills, traced-ID recovery). This job
  # never holds `packages: write` -- nothing in it pushes anywhere. It hands
  # the two images it built to `ui-gate` and `publish-images` as a build
  # artifact (`docker save` + upload, not a rebuild), so the images those
  # jobs act on are byte-for-byte what was scanned and integration-tested
  # here, not a second build that merely used the same Dockerfile.
  build-and-scan:
    runs-on: ubuntu-latest
    needs: [lint, unit, guard]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the service image
        run: docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -f services/Dockerfile -t aow/services:ci .

      - name: Build the UI image
        run: docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -f services/ui/Dockerfile -t aow/ui:ci .

      - name: Trivy -- services
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aow/services:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy -- ui
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aow/ui:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy -- the repository itself (config and dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Compose integration test
        run: bash scripts/ci-integration.sh

      # Everything downstream of this point -- publishing, the browser gate
      # -- acts on these exact bytes. Saved only after the scans and the
      # integration test above have passed, for the same reason the publish
      # step used to gate on them itself: what leaves this job is what was
      # actually tested, never a same-Dockerfile rebuild of it.
      - name: Save the tested images for downstream jobs
        run: docker save aow/services:ci aow/ui:ci -o aow-ci-images.tar

      - name: Share the tested images with downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aow-ci-images-${{ github.sha }}
          path: aow-ci-images.tar
          if-no-files-found: error
          # Short-lived and internal: consumed by ui-gate/publish-images in
          # this same workflow run, never referenced afterwards. Not the same
          # artifact as "Keep the release digest manifest" below, which is
          # the 30-day, human-facing digest record F10's offline release
          # proof and the CD release workflow both download by name.
          retention-days: 1

  # The headless-browser gate (F11): a real Chromium against the real stack,
  # asserting the page loads, its tabs render, it makes zero off-origin
  # requests, the as-of/coverage timestamp is visible, and the Forecast tab's
  # highlight cards never name a day before the viewed city's local today
  # (F6). Per-PR, not release-candidate-only: it reuses the images
  # build-and-scan already built and scanned, adds no large download, and
  # measured well under a minute of browser time against the real stack
  # locally -- see the F11 session report for the measured number.
  ui-gate:
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aow-ci-images-${{ github.sha }}

      - name: Load the tested images
        run: docker load -i aow-ci-images.tar

      # AOW_CI_SERVICES_IMAGE/AOW_CI_UI_IMAGE default to exactly the tags
      # `docker load` just restored (aow/services:ci, aow/ui:ci), so no
      # override is needed here -- only a worktree building its own
      # differently-tagged images for local verification needs one.
      - name: Browser gate (F11)
        run: bash scripts/ci-ui-gate.sh

  # RC-only: publishes the exact images build-and-scan tested to GHCR, then
  # keeps the digest manifest F10's offline release proof and the CD release
  # workflow both download by name. Split out of build-and-scan so that job
  # never has to hold `packages: write` on an ordinary PR run, where these
  # steps are skipped anyway; the two are otherwise identical to what used to
  # run inline, including the artifact name, the release/images.lock format,
  # `if-no-files-found: error`, and `retention-days: 30`.
  #
  # Do NOT add this job as a required status check: it only runs on push to
  # main, so a required PR check that can never run on a PR deadlocks every
  # merge under branch protection.
  publish-images:
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aow-ci-images-${{ github.sha }}

      - name: Load the tested images
        run: docker load -i aow-ci-images.tar

      # A plain `docker build` + `docker push` from a classic (non-containerd-
      # store) engine -- which is what this runner is -- publishes a bare
      # `application/vnd.docker.distribution.manifest.v2+json`: no index, no
      # platform descriptor. Confirmed against the actual artifact this
      # workflow already published (services:sha-23600ea...): `docker save`
      # of it on a containerd-snapshotter engine exits 0 and writes a 10,240
      # byte archive with 2 of the ~13 blobs the image actually has. That is
      # what `scripts/package-offline.sh` uses to build the offline bundle,
      # so an unpatched publish here would ship a silently-empty bundle on
      # exactly the engine class Docker Desktop defaults to.
      #
      # `docker buildx imagetools create --tag <ref> <ref>` wraps the pushed
      # manifest in an index carrying a linux/amd64 platform descriptor,
      # re-pointing the tag at the index while leaving the child manifest
      # digest -- the bytes Trivy scanned and ci-integration.sh tested --
      # unchanged. No rebuild, no new action, no docker-container buildx
      # driver.
      - name: Publish tested images by commit SHA
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA}"
          mkdir -p release
          printf 'commit %s\n' "$GITHUB_SHA" > release/images.lock
          for component in services ui; do
            image="$image_root/$component:$version"
            docker tag "aow/$component:ci" "$image"
            docker push "$image"
            docker buildx imagetools create --tag "$image" "$image"
            # Re-resolved after imagetools create, deliberately: the lock
            # must record the digest the tag resolves to now (the index),
            # not the pre-wrap child-manifest digest, because the index is
            # what a `docker save` archive records per alias, and therefore
            # what the offline bundle verification anchors against.
            #
            # Resolved with `imagetools inspect --format`: a registry-side
            # query that never consults the local image store. That matters
            # more than it looks. The previous version used `docker pull` +
            # `docker image inspect .RepoDigests`, verified against a real
            # multi-arch tag on a containerd-store engine, where it does
            # return the index. On the GitHub runner's *classic* store,
            # pulling a manifest list resolves to the platform-specific child
            # and RepoDigests records THAT instead. Same command, two answers,
            # decided by an image-store type nothing in this repo controls.
            # It shipped a lock naming the child while the tag named the
            # index, which fails bundle verification on the offline host.
            #
            # `docker manifest inspect -v` is a third code path with the same
            # trap: it returns one entry per child manifest, so naively
            # indexing it (e.g. `[0]`) also hands back a child digest.
            digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$image")"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::no index digest resolved for $image (got '$digest')"; exit 1 ;;
            esac
            digest_ref="$image_root/$component@$digest"
            echo "$component $digest_ref" | tee -a release/images.lock "$GITHUB_STEP_SUMMARY"
          done

      # A registry-side format assertion: it checks the shape of what was
      # published (an index/manifest-list with a linux/amd64 entry), not
      # `docker save` behaviour directly. The end-to-end proof that this
      # shape is actually what makes `docker save` work -- a full purge of a
      # containerd content store, a fresh pull of an imagetools-wrapped tag,
      # then a blob-completeness check -- lives on F10's separate host as
      # part of the offline-bundle verification; this step is the cheap
      # per-publish proxy for that, not a replacement for it. (This session
      # independently confirmed, read-only against the real published ref
      # ghcr.io/avihaishai/act-on-weather/services:sha-23600ea..., that this
      # exact check fails loudly on the un-wrapped bare manifest and passes
      # on a real index (alpine:3.20) -- see the F11 session report.)
      #
      # This also generalises beyond the bug that motivated it: F8 hit a
      # related mistake resolving a digest via `docker manifest inspect -v`
      # and indexing into the result, which returns one entry per *child*
      # manifest -- `[0]` is an amd64 child digest, not the index. A check on
      # the raw mediaType and platform list, run against whatever ref was
      # just published, catches that shape of mistake for any image added
      # here later, not only this one.
      #
      # Why this only needs checking here, not on every developer machine:
      # a GitHub-hosted runner gets a fresh Docker daemon per job, so it is
      # clean by construction and cannot inherit a stale platform-less record
      # from a previous pull the way a long-lived host can. That precondition
      # does NOT hold for a staging/release host that keeps its image store
      # between runs -- F10 documents it as release-critical on their side.
      - name: Published images carry a linux/amd64 platform descriptor
        run: |
          set -euo pipefail
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA}"
          manifest_file="$(mktemp)"
          trap 'rm -f "$manifest_file"' EXIT
          for component in services ui; do
            ref="$image_root/$component:$version"
            # The heredoc is Python's stdin, so the registry JSON must be in
            # a file. Piping it here leaves json.load with an empty stream.
            docker buildx imagetools inspect --raw "$ref" > "$manifest_file"
            python3 - "$ref" "$manifest_file" <<'PY'
          import json
          import sys

          ref = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as source:
              manifest = json.load(source)
          media_type = manifest.get("mediaType", "")
          is_index = media_type in (
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          )
          platforms = [
              (entry.get("platform") or {})
              for entry in manifest.get("manifests", [])
          ]
          has_linux_amd64 = any(
              p.get("os") == "linux" and p.get("architecture") == "amd64"
              for p in platforms
          )
          if not (is_index and has_linux_amd64):
              print(
                  f"::error::{ref} is not published as a platform-described index "
                  f"(mediaType={media_type!r}, platforms={platforms!r}) -- "
                  "docker save of this shape can silently export almost nothing"
              )
              sys.exit(1)
          print(f"{ref}: {media_type}, linux/amd64 present -- OK")
          PY
          done

          # And release/images.lock has to name that same index. A child digest
          # here does not merely mismatch the archive -- it reintroduces the
          # original defect, because scripts/package-offline.sh pulls the
          # reference straight out of this lock. Pulling by a child digest
          # returns exactly the platform-less single manifest whose
          # `docker save` writes a manifest and no layers, so a bad lock
          # rebuilds the empty-bundle bug and the failure surfaces three steps
          # downstream, looking like a packaging fault rather than a bad lock.
          #
          # Both halves are checked, per component: the digest the lock names
          # must equal what the tag resolves to, and the manifest AT that
          # digest must be an index. The regression that prompted this
          # produced different answers for `services` and `ui` in the same
          # run -- `grep -m1` over RepoDigests, which after a push and a
          # pull can hold both the child and the index and returns whichever
          # the daemon listed first -- so a single-image check would have
          # passed it.
          for component in services ui; do
            ref="$image_root/$component:$version"
            locked_file="$(mktemp)"
            tag_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")"
            lock_digest="$(awk -v c="$component" '$1 == c {print $2}' release/images.lock | sed 's/.*@//')"
            if [ "$tag_digest" != "$lock_digest" ]; then
              echo "::error::release/images.lock records $component@$lock_digest but $ref resolves to $tag_digest"
              exit 1
            fi
            docker buildx imagetools inspect --raw "$image_root/$component@$lock_digest" > "$locked_file"
            python3 - "$component" "$lock_digest" "$locked_file" <<'PY'
          import json
          import sys

          component, digest, path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          media_type = manifest.get("mediaType", "")
          if media_type not in (
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          ):
              print(
                  f"::error::release/images.lock records {component}@{digest}, "
                  f"whose manifest is {media_type!r} rather than an index. "
                  "package-offline.sh pulls this reference, and pulling a child "
                  "manifest recreates the empty-archive defect"
              )
              sys.exit(1)
          print(f"{component}: the lock names the index {digest} -- OK")
          PY
          done

      - name: Keep the release digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aow-images-${{ github.sha }}
          path: release/images.lock
          if-no-files-found: error
          retention-days: 30

  # RC-only: the real llama.cpp + Qwen3-1.7B adversarial grounding probe
  # (tests/integration/model_grounding.py, 431 lines, run by hand until now).
  # It needs a ~1.28 GB model download (cached, so paid rarely rather than
  # never) and a real model server boot, a materially different cost profile
  # from every other gate in this file, and one this session could not
  # measure on an actual GitHub-hosted runner -- see the F11 session report
  # for what was and was not verified, and re-time the first few real runs.
  # Triggered by workflow_dispatch, a `release-candidate` PR label, or a push
  # to a `release/*` branch: the three points in this repo's flow where a
  # maintainer is about to cut a release rather than iterate on a PR.
  model-grounding:
    runs-on: ubuntu-latest
    needs: [lint, unit, guard]
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keyed on models.lock's content, not a fixed name: the key changes the
      # moment the pinned model or its hash does, so a stale cache can never
      # be restored under a key that still matches.
      - name: Restore the staged model from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/Qwen3-1.7B-Q4_K_M.gguf
          key: model-weights-${{ hashFiles('models.lock') }}

      # Runs on every invocation, cache hit or miss. scripts/stage_model.py
      # always re-verifies the sha256 of a file that already exists at the
      # target path before accepting it (it hard-stops on a mismatch rather
      # than silently re-fetching) -- exactly the "verify after cache
      # restore too" property a restored cache needs, because a cache is
      # restored, not authenticated. MODEL_BASE_URL is a repository
      # *variable*, not a secret: it names a plain HTTPS mirror URL with no
      # embedded credential, set by whoever configures this repo's CI
      # (Settings -> Secrets and variables -> Actions -> Variables). On a
      # cache hit this step still runs, but touches the network only if the
      # hash does not already match.
      - name: Stage and verify the model
        env:
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
        run: python scripts/stage_model.py

      - name: Model grounding probe (real llama.cpp + Qwen3-1.7B)
        run: |
          started=$(date +%s)
          bash scripts/ci-model-grounding.sh
          elapsed=$(( $(date +%s) - started ))
          echo "model-grounding wall clock: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"

  # The recovery drill (F8/B3/M11). Release-candidate only, on the same
  # trigger as model-grounding -- not on cost, at ~120s it is cheap next to
  # build-and-scan, but on blast radius: it destroys its own volumes, and a
  # stateful full-stack drill is the wrong default for every dependabot bump
  # and docs typo. One "expensive or stateful" tier, not two conventions.
  #
  # What it asserts, and why this job exists rather than a healthcheck: the
  # drill accepts message IDs, backs up, accepts more, destroys pgdata,
  # rabbitdata and all three outbox volumes, restores, and then asserts with
  # a SEPARATE READER (psql, not the API that accepted the writes) that
  # `SELECT count(*) FROM ingest_log WHERE message_id = '<id>'` is exactly 1
  # for every pre-backup ID. Exactly once, not at least once. The post-backup
  # IDs are asserted absent AND asserted to have been committed before the
  # disruption, so a regression where the API quietly stops accepting writes
  # cannot make "all of them are gone" trivially true and pass proving
  # nothing. M11's guarantee is about accepted records, not process liveness.
  restore-drill:
    runs-on: ubuntu-latest
    needs: [lint, unit, guard]
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'release-candidate'))
    # Measured by F8 at 116s on a branch and 120s on the merged tree. The
    # headroom is deliberate and goes here rather than in the script: a
    # `docker compose exec` hangs indefinitely if the daemon disappears
    # mid-call, and there is no portable `timeout` across Git Bash and macOS,
    # so the job-level bound is the only place that reliably stops it.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `aow/services:ci` is local-only and nothing in the drill builds it.
      # Inside build-and-scan it already exists; this is a separate job, so it
      # starts with an empty image store and the drill would die on a missing
      # image. That is exactly the failure this repo's browser gate hit on its
      # first real runner run ("No such image: nginx:alpine@sha256:..."), which
      # passed locally only because the image happened to be in the store.
      # Everything else the drill starts is digest-pinned and it uses
      # --no-build without --pull never, so those resolve normally.
      - name: Build the service image the drill runs against
        run: docker build -f services/Dockerfile -t aow/services:ci .

      - name: Backup and restore drill (accepted IDs must survive)
        env:
          AOW_COMPOSE_OVERLAY: compose.ci.yml
          # Both, and they are not redundant. AOW_CI_SERVICES_IMAGE is what
          # compose.ci.yml substitutes for the stack's own services;
          # AOW_SERVICES_IMAGE is what the drill passes to the `docker run`
          # helper containers it starts outside Compose, and it defaults to
          # aow/services:dev. Setting only the first got
          # "pull access denied for aow/services" on the first real run --
          # the stack came up correctly and the helpers went looking for a
          # tag that exists on nobody's registry.
          AOW_CI_SERVICES_IMAGE: aow/services:ci
          AOW_SERVICES_IMAGE: aow/services:ci
        run: |
          started=$(date +%s)
          bash demos/06_backup_restore.sh
          elapsed=$(( $(date +%s) - started ))
          echo "restore-drill wall clock: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
