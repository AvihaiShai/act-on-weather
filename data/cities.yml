# The five cities. Coordinates are committed, never geocoded at runtime.
# Rome and London make the brief's two example questions work as written.
#
# `coastal` gates the activities that carry `requires_coast` in
# data/activities.yml -- surfing, swimming, the beach, fishing, a boat ride.
# A city marked false gets no row for them at all, which is the honest answer:
# the forecast for an inland city says nothing about surf.
# Rome is true because Lido di Ostia is inside Roma Capitale and on the metro;
# London is false -- the Thames is tidal, but it is not a coast.
cities:
  - slug: rome
    name: Rome
    country: Italy
    lat: 41.8933
    lon: 12.4829
    timezone: Europe/Rome
    aliases: [rome, roma]
    coastal: true
  - slug: london
    name: London
    country: United Kingdom
    lat: 51.5074
    lon: -0.1278
    timezone: Europe/London
    aliases: [london]
    coastal: false
  - slug: lisbon
    name: Lisbon
    country: Portugal
    lat: 38.7223
    lon: -9.1393
    timezone: Europe/Lisbon
    aliases: [lisbon, lisboa]
    coastal: true
  - slug: tel-aviv
    name: Tel Aviv
    country: Israel
    lat: 32.0853
    lon: 34.7818
    timezone: Asia/Jerusalem
    aliases: ["tel aviv", "tel-aviv", telaviv]
    coastal: true
  - slug: reykjavik
    name: Reykjavik
    country: Iceland
    lat: 64.1466
    lon: -21.9426
    timezone: Atlantic/Reykjavik
    aliases: [reykjavik, "reykjavík"]
    coastal: true
