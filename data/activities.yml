# Deterministic suitability rules. The score is the source of truth (M2);
# the LLM only phrases what these rules decided.
#
# score: 0-100, computed by services/common/rules.py. rule_version is bumped
# whenever any threshold below changes, which re-scores and re-words every
# stored recommendation on the next ingest.
#
# Keys an activity may carry:
#   label            what the UI and the agent call it
#   icon             a unicode glyph; no webfont, so it renders air-gapped
#   keywords         the words a user actually types for this activity. The
#                    agent's router matches on them so it can tell when a
#                    question asks about an activity it holds no row for,
#                    and say so instead of letting the model improvise one.
#   indoor           true -> scored as the inverse of outdoor comfort
#   interests        which data/interests.yml keys this activity serves. The
#                    trip planner uses it to weight the day's pick towards
#                    what the traveller actually asked for.
#   where_noun       what an answer calls the place you do this activity ("a
#                    surf spot"), used by the agent's `where` route when it has
#                    to report that it holds none. Wording only: it never makes
#                    a location answerable. Set it where the generated fallback
#                    ("place for surfing") reads badly; otherwise leave it out
#                    and the first `place_categories` entry, or the label, is
#                    used.
#   place_categories places.category values that ARE a venue for this activity,
#                    so the planner can name where to go rather than listing
#                    whatever matched the traveller's interests. Set only where
#                    the source class is the venue by definition: a place the
#                    source calls a beach is where you spend a day at the
#                    beach. It is deliberately absent from surfing, swimming,
#                    fishing and boat rides -- Wikidata Q40080 and OSM
#                    `natural=beach` assert that a beach is there, not that it
#                    has rideable surf, lifeguarded water, permitted angling or
#                    a boat to hire, and the system does not claim what its
#                    sources do not say. An activity with no key here keeps the
#                    old behaviour: the day lists interest-matched places only.
#   requires_coast   only scored for cities with `coastal: true` in cities.yml.
#                    A city with no coast gets no row at all, rather than a
#                    surfing score invented from an inland forecast.
#   sea_state_unmeasured
#                    the quality of this activity depends on the water, and
#                    this system holds no evidence about the water. It ingests
#                    a land forecast -- temperature, rain, wind, sun, UV -- and
#                    no wave height, no swell period and no sea temperature
#                    from any source. Surfing, swimming, fishing and a boat
#                    ride carry it. A beach day deliberately does not: a day
#                    on the sand is a judgement about shore weather, which is
#                    exactly what is measured. Every answer that shows a score
#                    for a flagged activity must carry the caveat in
#                    services/common/coast.sea_state_caveat, which also names
#                    how far the city's forecast point is from its coast.
#   score_ceiling    the highest score this activity may reach, applied in
#                    rules.score_activity after the penalties and before the
#                    band. The four flagged above are capped at 69, which is
#                    one point below the `good` floor in rules.BANDS: an
#                    activity whose sea conditions are unknown can be reported
#                    as at best `fair`, and can never be the thing the planner
#                    recommends most confidently. The cap is the deliberate
#                    price of not holding marine data -- adding a wave feed
#                    would be the other way to close this, and it would mean a
#                    second provider staged into the offline bundle. When the
#                    cap actually binds, the scorer says so in the reasons, so
#                    the number is never lowered silently.
#   ideal_temp_c     [lo, hi]
#   min_wind_kmh     wind the activity NEEDS (surfing); too calm is penalised
#   max_wind_kmh / max_precip_mm / max_precip_prob / max_uv / min_sunshine_hours
#   indoor_floor / indoor_weight   see rules.outdoor_comfort; they are what
#                    stops every indoor activity scoring identically on a day
# 3: the four sea-dependent activities gained `sea_state_unmeasured` and a
# score ceiling, which re-scores and re-words every stored recommendation on
# the next ingest. That is the intended effect -- a surfing recommendation
# written under version 2 could say "good", and nothing in this system ever
# measured the water it was talking about.
rule_version: 3

activities:

  # ------------------------------------------------------------- outdoor --

  running:
    label: Running
    keywords: ["running", "run", "jog", "jogging", "a run"]
    icon: "\U0001F3C3"
    indoor: false
    interests: [sports, outdoors]
    ideal_temp_c: [8, 20]
    max_precip_mm: 2.0
    max_precip_prob: 40
    max_wind_kmh: 30
    max_uv: 8

  hiking:
    label: Hiking or a long walk
    keywords: ["hiking", "hike", "a long walk", "walking", "walk", "trek", "trekking", "ramble"]
    icon: "\U0001F97E"
    indoor: false
    interests: [outdoors]
    ideal_temp_c: [6, 24]
    max_precip_mm: 3.0
    max_precip_prob: 45
    max_wind_kmh: 35
    max_uv: 9

  outdoor_workout:
    label: An outdoor workout
    keywords: ["outdoor workout", "workout", "exercise", "training", "calisthenics"]
    icon: "\U0001F4AA"
    indoor: false
    interests: [sports]
    ideal_temp_c: [10, 26]
    max_precip_mm: 1.0
    max_precip_prob: 35
    max_wind_kmh: 30
    max_uv: 8

  soccer:
    label: A game of football
    keywords: ["football", "soccer", "a kickabout", "five a side"]
    icon: "⚽"
    indoor: false
    interests: [sports]
    ideal_temp_c: [6, 26]
    max_precip_mm: 4.0
    max_precip_prob: 55
    max_wind_kmh: 35

  sightseeing:
    label: Sightseeing on foot
    keywords: ["sightseeing", "sights", "walking tour", "explore the city"]
    icon: "\U0001F5FA"
    indoor: false
    interests: [history, outdoors]
    place_categories: [monument, attraction, viewpoint]
    ideal_temp_c: [12, 26]
    max_precip_mm: 4.0
    max_precip_prob: 55
    max_wind_kmh: 40
    max_uv: 9

  sunset_watching:
    label: Watching the sunset
    keywords: ["sunset", "sunsets", "watch the sunset", "golden hour"]
    icon: "\U0001F305"
    indoor: false
    interests: [outdoors]
    ideal_temp_c: [10, 30]
    max_precip_mm: 1.0
    max_precip_prob: 30
    max_wind_kmh: 35
    min_sunshine_hours: 3

  farmers_market:
    label: An open-air farmers' market
    keywords: ["farmers market", "farmers' market", "market", "markets", "street market"]
    icon: "\U0001F9FA"
    indoor: false
    interests: [shopping, dining]
    place_categories: [market]
    ideal_temp_c: [8, 28]
    max_precip_mm: 2.0
    max_precip_prob: 45
    max_wind_kmh: 30

  music_festival:
    label: An open-air music festival
    keywords: ["festival", "festivals", "open air concert", "outdoor concert"]
    icon: "\U0001F3AA"
    indoor: false
    interests: [concerts]
    ideal_temp_c: [12, 30]
    max_precip_mm: 2.0
    max_precip_prob: 40
    max_wind_kmh: 30
    min_sunshine_hours: 2

  # --------------------------------------------------- outdoor, on a coast --
  # Scored only where there is a coast. See `requires_coast` above: the
  # alternative -- scoring surfing in London from an inland forecast -- is a
  # number the system cannot stand behind.
  #
  # Having a coast is not the same as knowing what the water is doing. Four of
  # the five below carry `sea_state_unmeasured` and a `score_ceiling`, because
  # their quality is a property of the sea and every input this system holds is
  # a property of the air above the land. `beach_day` is the exception and
  # keeps its full range: a day on the sand is a judgement about sun, heat,
  # rain and wind, and those are measured.

  beach_day:
    label: A day at the beach
    keywords: ["beach", "the beach", "sunbathing", "sunbathe"]
    icon: "\U0001F3D6"
    indoor: false
    requires_coast: true
    interests: [outdoors]
    # The one coastal activity whose venue the sources actually name. Surfing,
    # swimming, fishing and a boat ride deliberately have no such key.
    place_categories: [beach]
    ideal_temp_c: [24, 34]
    max_precip_mm: 0.5
    max_precip_prob: 20
    max_wind_kmh: 25
    min_sunshine_hours: 5

  swimming:
    label: Swimming in the sea
    keywords: ["swimming", "swim", "a swim", "sea swim", "bathing"]
    icon: "\U0001F3CA"
    indoor: false
    requires_coast: true
    sea_state_unmeasured: true
    score_ceiling: 69
    where_noun: supervised swimming spot
    interests: [sports, outdoors]
    ideal_temp_c: [24, 36]
    max_precip_mm: 1.0
    max_precip_prob: 25
    max_wind_kmh: 22
    min_sunshine_hours: 4

  surfing:
    label: Surfing
    keywords: ["surfing", "surf", "a surf", "surfs", "waves", "bodyboarding"]
    icon: "\U0001F3C4"
    indoor: false
    requires_coast: true
    sea_state_unmeasured: true
    score_ceiling: 69
    where_noun: surf spot
    interests: [sports, outdoors]
    ideal_temp_c: [16, 32]
    max_precip_mm: 5.0
    max_precip_prob: 60
    # Surfing is the one activity here that wants wind rather than merely
    # tolerating it: a flat, windless day has no swell.
    min_wind_kmh: 12
    max_wind_kmh: 45

  fishing:
    label: Fishing
    keywords: ["fishing", "fish", "angling", "to fish"]
    icon: "\U0001F3A3"
    indoor: false
    requires_coast: true
    sea_state_unmeasured: true
    score_ceiling: 69
    where_noun: fishing spot
    interests: [outdoors]
    ideal_temp_c: [8, 30]
    max_precip_mm: 3.0
    max_precip_prob: 50
    max_wind_kmh: 25

  boat_ride:
    label: A boat ride
    keywords: ["boat ride", "boat", "boating", "sailing", "sail", "cruise", "kayak"]
    icon: "⛵"
    indoor: false
    requires_coast: true
    sea_state_unmeasured: true
    score_ceiling: 69
    where_noun: boat hire
    interests: [outdoors]
    ideal_temp_c: [16, 32]
    max_precip_mm: 1.0
    max_precip_prob: 30
    max_wind_kmh: 20
    min_sunshine_hours: 3

  # -------------------------------------------------------------- indoor --
  # Inverted on purpose: bad weather outside is a good day to be indoors.
  # `indoor_floor` is how good the activity is on a perfect day outside, and
  # `indoor_weight` is how much bad weather improves its case. Without those
  # two, every indoor activity scored identically and the planner had nothing
  # to choose between them.

  museums:
    label: Visiting a museum
    keywords: ["museum", "museums"]
    icon: "\U0001F3DB"
    indoor: true
    interests: [museums, history]
    place_categories: [museum]
    indoor_floor: 55
    indoor_weight: 0.45

  art_gallery:
    label: An art gallery
    keywords: ["gallery", "galleries", "art gallery", "art"]
    icon: "\U0001F5BC"
    indoor: true
    interests: [museums]
    place_categories: [gallery]
    indoor_floor: 50
    indoor_weight: 0.45

  standup_comedy:
    label: A stand-up comedy show
    keywords: ["stand up", "stand-up", "standup", "comedy", "comedy show"]
    icon: "\U0001F3A4"
    indoor: true
    interests: [concerts]
    indoor_floor: 45
    indoor_weight: 0.5

  mall:
    label: Shopping at the mall
    keywords: ["mall", "malls", "shopping centre", "shopping center", "shopping mall"]
    icon: "\U0001F6CD"
    indoor: true
    interests: [shopping]
    place_categories: [shopping]
    indoor_floor: 40
    indoor_weight: 0.6

  indoor_gaming:
    label: Staying in to play computer games
    keywords: ["computer games", "video games", "gaming", "console", "stay in"]
    icon: "\U0001F3AE"
    indoor: true
    interests: []
    # The brief names this one explicitly. Lowest floor of the five: it is
    # only a compelling plan when outside is genuinely unpleasant.
    indoor_floor: 25
    indoor_weight: 0.75
