# The observability edge. A second copy of the pattern in edge/nginx.conf, and
# it exists for the same single reason: Docker cannot publish a port from an
# `internal: true` network, so something has to straddle the boundary.
#
# Why a second proxy rather than another `server` block in the first one: the
# monitoring stack is an overlay, and compose.yml must stay valid and complete
# without it. A `server { proxy_pass grafana:3000 }` in edge/nginx.conf would
# be dead config -- and a published port with nothing behind it -- on every
# run that does not use compose.observability.yml. Splitting them keeps each
# file true about the stack it belongs to.
#
# Like `edge`, this container holds no application logic, no credentials and
# no outbound client. Grafana's admin password lives in Grafana.
worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS, resolved through a *variable* at request time. Same
  # trick and same reason as edge/nginx.conf: nginx refuses to start if a
  # proxy_pass hostname cannot be resolved at config load, so a literal
  # `proxy_pass http://grafana:3000` would make this container crash-loop for
  # as long as Grafana is still starting -- which, on first boot, is while
  # Grafana runs its migrations.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 3000;
    server_name _;

    # The air-gap has to hold in the reviewer's browser as well, and no
    # container network can help there: the browser is on the host, and the
    # host has the internet. Grafana's own defaults would have it fetch
    # gravatar avatars and grafana.com assets from the browser, so this header
    # is what actually stops that -- GF_SECURITY_DISABLE_GRAVATAR and the
    # analytics flags in compose.observability.yml are the polite request, and
    # this is the refusal.
    #
    # 'unsafe-inline' and 'unsafe-eval' are what Grafana's bundle needs, the
    # same concession the UI's CSP makes for Streamlit. They are named here
    # rather than quietly included. ws:/wss: are for Grafana Live, which the
    # dashboards do not use but the UI opens anyway.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;

    # Answered here, by nginx, so that `docker compose ps` can tell "the proxy
    # is up" apart from "Grafana is up". Grafana's own health is on
    # /api/health and is checked by Grafana's healthcheck, not this one.
    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
      set $grafana grafana:3000;
      proxy_pass http://$grafana;
      proxy_http_version 1.1;
      # Grafana Live (dashboard streaming) is a WebSocket upgrade.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # A dashboard query that spans the whole retention window can take a
      # while on a CPU-bound host; 120s is well past anything these two
      # dashboards ask for and well short of hanging forever.
      proxy_read_timeout 120s;
    }
  }
}
