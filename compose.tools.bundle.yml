# Run the already packaged one-shot tools without building or pulling images.
# Combine with compose.tools.yml from the release folder.
services:
  stage:
    image: aow-bundle/stage:${AOW_IMAGE_VERSION:?set AOW_IMAGE_VERSION}
  demos:
    image: aow-bundle/demos:${AOW_IMAGE_VERSION:?set AOW_IMAGE_VERSION}
    environment:
      # The helper containers demos/06_backup_restore.sh starts for itself.
      # Without this it defaults to aow/services:dev, which a bundle install
      # never creates -- and `docker run` on a missing tag contacts the
      # registry, which on the air-gapped host this proof exists for is the one
      # thing that must not happen.
      AOW_SERVICES_IMAGE: aow-bundle/services:${AOW_IMAGE_VERSION:?set AOW_IMAGE_VERSION}
  refresh:
    image: aow-bundle/demos:${AOW_IMAGE_VERSION:?set AOW_IMAGE_VERSION}
    environment:
      REFRESH_GUARD_IMAGE: aow-bundle/demos:${AOW_IMAGE_VERSION:?set AOW_IMAGE_VERSION}
