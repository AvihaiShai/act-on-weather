# The only container on a routable network. It exists because Docker cannot
# publish a port from an `internal: true` network -- it holds no application
# logic, no credentials and no outbound client.
worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS. Resolving upstreams through a *variable* at request
  # time is deliberate: nginx refuses to start if a proxy_pass hostname cannot
  # be resolved at config load, which would make `edge` crash-loop whenever a
  # backend service is not running yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- UI (Streamlit) ----
  server {
    listen 8080;
    server_name _;

    # Offline has to hold in the reviewer's browser too, where our internal
    # networks have no reach. This makes the browser itself refuse any
    # off-origin request. ws:/wss: are required for Streamlit's own socket.
    # 'unsafe-inline'/'unsafe-eval' are what Streamlit's bundle needs -- noted
    # in the README rather than quietly included.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
      set $ui ui:8501;
      proxy_pass http://$ui;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }

  # ---- API (FastAPI) ----
  server {
    listen 8000;
    server_name _;

    location / {
      set $api api:8000;
      proxy_pass http://$api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }
  }
}
