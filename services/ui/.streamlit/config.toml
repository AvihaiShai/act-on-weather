[server]
headless = true
address = "0.0.0.0"
port = 8501

[browser]
# No phone-home: the runtime must make zero network calls.
gatherUsageStats = false
# Streamlit XSRF compares the websocket Origin against these. The browser
# talks to the edge proxy on 8080, not to Streamlit on 8501, so without this
# the socket is rejected and the page hangs on Connecting...
serverAddress = "localhost"
serverPort = 8080

[theme]
base = "light"
